[project]
name = "gqh-systematic-track"
version = "0.1.0"
description = "Systematic trading research for Gator Quant Hacks 2026"
requires-python = ">=3.12,<3.13"
dependencies = [
    "databento>=0.87.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "yfinance>=1.7.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
